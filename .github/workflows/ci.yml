name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build the harness and run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Rhino 2.0 is a snapshot published to the local Maven repository only (harness-rhino2.0), so
      # CI builds and tests the Rhino 1.9 harness, from Maven Central.
      - name: Build the Rhino 1.9 harness jar (bundles Rhino from Maven Central)
        working-directory: harness-rhino1.9
        # gradle.properties pins org.gradle.java.home to a local path; the command line wins.
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" fatJar

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install oxpecker
        run: pip install -e '.[dev]'

      - name: Run the tests
        env:
          OXPECKER_JAVA: ${{ env.JAVA_HOME }}/bin/java
          OXPECKER_HARNESS: rhino1.9
        run: pytest -q

      - name: Keep the harness jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oxpecker-harness
          path: harness-rhino1.9/build/libs/oxpecker-harness-all.jar
          retention-days: 7
